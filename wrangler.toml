name = "id-zentala-pl"
compatibility_date = "2026-07-01"
account_id = "84c3ee9acdac8503a8bbcfd0edb39877"

# NOTE: `routes` must stay ABOVE the [assets] table header — in TOML every key
# after a table header belongs to that table, so placing it below silently makes
# it `assets.routes` and wrangler ignores the routing entirely.
routes = [
  { pattern = "id.zentala.pl", custom_domain = true }
]

# Static-assets-only Worker (no `main`): Cloudflare serves ./deploy directly.
[assets]
directory = "./deploy"
not_found_handling = "404-page"
